# Generate There.xcodeproj with:  xcodegen generate
name: There
options:
  bundleIdPrefix: com.there-chat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      THERE_API_BASE_URL: http://localhost:8080
    Release:
      THERE_API_BASE_URL: https://api.there-chat.com
targets:
  There:
    type: application
    platform: iOS
    sources:
      - There
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.there-chat.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "There uses your location to show the chats around you. Your location is never stored."
        INFOPLIST_KEY_CFBundleDisplayName: There
    info:
      path: There/Info.plist
      properties:
        ThereAPIBaseURL: $(THERE_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.there-chat.app
            CFBundleURLSchemes: [there]
  ThereTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ThereTests
    dependencies:
      - target: There
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
