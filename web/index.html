<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>There</title>
<meta name="description" content="Anonymous chats tied to places on the map.">
<style>
  :root { color-scheme: light dark; --ink: #121e49; --muted: #949bb4; --accent: #264bca; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6e9f5; --muted: #8a91aa; --accent: #6e8cff; --bg: #0e1120; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, Roboto, sans-serif; padding: 0 16px; }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 3rem; margin: 0; color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>There</h1>
  <p>Anonymous chats tied to places on the map. Coming soon to iOS and Android.</p>
</main>
</body>
</html>
